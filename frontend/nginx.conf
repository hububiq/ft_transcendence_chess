server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 172.29.45.254;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/ssl/certs/twoj_certyfikat.crt;
    ssl_certificate_key /etc/ssl/private/twoj_klucz.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Serve React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy FastAPI WebSockets
    location /ws/ {
        proxy_pass http://fastapi_backend:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
    }

    # 3. Proxy FastAPI REST API Routes
    # (Routes mapped in your main.py to FastAPI)
    location ~ ^/api/(games|tournaments|statistics/history|history)/ {
        proxy_pass http://fastapi_backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Proxy Django REST API Routes
    # (Fallback for login, register, friends, profile, etc.)
    location /api/ {
        proxy_pass http://django_backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 5. Django Admin & Media/Static
    location /admin/ {
        proxy_pass http://django_backend:8000/admin/;
        proxy_set_header Host $host;
    }
    location /media/ {
        proxy_pass http://django_backend:8000/media/;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://django_backend:8000/static/;
        proxy_set_header Host $host;
    }
    location /accounts/ {
        proxy_pass http://django_backend:8000/accounts/;
        proxy_set_header Host $host;
    }
}