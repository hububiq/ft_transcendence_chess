server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Route A. Serve React Frontend
    location / {
		root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

        # FastAPI REST endpoints
    location ~ ^/api/(games|tournaments|statistics/history|history)(/|$) {
        proxy_pass http://fastapi_backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

   # Route B: Django Auth & Profiles
    location /api/ {
        proxy_pass http://django_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Route C: FastAPI Game Engine & Tournaments
    # (FastAPI will need its REST routes changed from /api/ to something like /game-api/ to avoid clashing with Django!)
    # location /game-api/ {
    #     proxy_pass http://fastapi_backend:8001;
    #     proxy_set_header Host $host;
    # }

    # Route D: Secure WebSockets (wss://)
    location /ws/ {
        proxy_pass http://fastapi_backend:8001;
        
        # 👇 THESE ARE THE MAGIC HEADERS THAT MAKE WEBSOCKETS WORK THROUGH NGINX 👇
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Route E. Django Admin & Media/Static
    location /admin/ {
        proxy_pass http://django_backend:8000/admin/;
        proxy_set_header Host $host;
    }
    location /media/ {
        proxy_pass http://django_backend:8000/media/;
        proxy_set_header Host $host;
    }
    location /static/ {
        proxy_pass http://django_backend:8000/static/;
        proxy_set_header Host $host;
    }
    location /accounts/ {
        proxy_pass http://django_backend:8000/accounts/;
        proxy_set_header Host $host;
    }
}